name: Django Backend Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup the Docker compose
      run: docker-compose up -d
    - name: Run Tests
      run: docker exec backen sh -c "flake8 & pytest ."
